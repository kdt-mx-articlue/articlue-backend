name: docker-image

# main 에 병합되면 이 서비스 이미지를 빌드해 Docker Hub 에 올리고, 래퍼 repo(articlue-deploy)에 배포를 요청한다.
#   태그: :portfolio (서버가 받는 최신) / :<커밋 SHA> (롤백용). 기존 :latest 는 팀 서버용이라 건드리지 않음
#   Secrets 미설정 시 빌드만 검증 (push·배포 요청 생략)
#     DOCKERHUB_USERNAME, DOCKERHUB_TOKEN : 이미지 push
#     DEPLOY_DISPATCH_TOKEN              : articlue-deploy 에 배포 요청 (Fine-grained PAT, 대상 repo Contents: Read & Write)
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      SERVICE: articlue-backend
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'docker.io/scv3114' }}
      PUSH_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        if: env.PUSH_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub Secrets 없음 안내
        if: env.PUSH_ENABLED != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 미설정 — 빌드만 검증하고 push 는 생략합니다."

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_ENABLED == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVICE }}:portfolio
            ${{ env.REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 요청 (articlue-deploy)
        if: env.PUSH_ENABLED == 'true' && env.DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kdt-mx-articlue/articlue-deploy/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"service\":\"$SERVICE\",\"sha\":\"$GITHUB_SHA\"}}"

      - name: 배포 요청 생략 안내
        if: env.PUSH_ENABLED == 'true' && env.DISPATCH_TOKEN == ''
        run: echo "::notice::DEPLOY_DISPATCH_TOKEN 미설정 — 이미지는 올렸고, 배포는 articlue-deploy Actions 에서 수동 실행하세요."
